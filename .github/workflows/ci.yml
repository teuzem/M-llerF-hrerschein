name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, consistency & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint

      - name: Check content consistency
        # Numéro de téléphone unique, absence de tirets cadratins et de
        # caractères invisibles, traductions réellement traduites.
        run: node scripts/check-consistency.mjs

      - name: Build
        run: npm run build

      - name: Verify phone number in the built site
        run: |
          set -e
          grep -rq '+49 15510 626077' dist/
          if grep -rq '4915212399096' dist/; then
            echo "Ancien numéro de téléphone détectifié dans le build."
            exit 1
          fi
          echo "Numéro de téléphone correct dans le build."
